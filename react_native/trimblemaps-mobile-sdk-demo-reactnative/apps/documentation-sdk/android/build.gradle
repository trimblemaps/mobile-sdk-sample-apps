// Windows: deep monorepo paths exceed CMake's default 250-char object path limit.
// AGP's bundled Ninja (1.10.x) also lacks long-path support; use a newer Ninja if installed.
def windowsNinja = new File(
        System.getenv("LOCALAPPDATA"),
        "Microsoft/WinGet/Packages/Ninja-build.Ninja_Microsoft.Winget.Source_8wekyb3d8bbwe/ninja.exe"
)
ext.windowsCmakeArgs = ["-DCMAKE_OBJECT_PATH_MAX=1024"]
if (windowsNinja.isFile()) {
    ext.windowsCmakeArgs += "-DCMAKE_MAKE_PROGRAM=${windowsNinja.absolutePath.replace('\\', '/')}"
}

buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 25
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

allprojects {
    repositories {
        mavenLocal()
        maven {
            url "https://trimblemaps.jfrog.io/artifactory/android"
        }
    }
}

subprojects { subproject ->
    subproject.plugins.withId("com.android.library") {
        subproject.android {
            defaultConfig {
                externalNativeBuild {
                    cmake {
                        arguments(*rootProject.ext.windowsCmakeArgs)
                    }
                }
            }
        }
    }
}
